    (function() {
  
        const ua = navigator.userAgent;
        
       
        const isMobileUA = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
        
       
        const isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1; 
        
  
        const isChromebook = /CrOS/i.test(ua);
        
      
        const isLiterallyMobile = (isMobileUA || isIPadOS) && !isChromebook;

        if (isLiterallyMobile) {
           
            const style = document.createElement('style');
            style.innerHTML = '#shield { display: none !important; pointer-events: none !important; }';
            document.head.appendChild(style);

            
            window.addEventListener('DOMContentLoaded', () => {
                const shield = document.getElementById('shield');
                if (shield) shield.innerHTML = ''; 
            });
        }
    })();
</script>
</body>
</html>
