<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#00f0ff" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="NEXUS EXTRACTOR — Advanced file extraction, editing, and analysis tool. Works offline." />
  <meta name="application-name" content="NEXUS EXTRACTOR" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NEXUS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>NEXUS EXTRACTOR v5.0</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#00f0ff" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: '#050505',
            surface: '#111111',
            panel: '#1a1a1a',
            cyan: '#00f0ff',
            purple: '#8a2be2',
            crimson: '#ff003c',
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.29/dist/zip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --bg-void: #050505;
      --bg-surface: #111111;
      --bg-panel: #1a1a1a;
      --nexus-cyan: #00f0ff;
      --nexus-purple: #8a2be2;
      --nexus-red: #ff003c;
      --text-main: #e0e0e0;
      --text-muted: #666666;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --vh: 1vh;
      --dvh: 1vh;
      --header-height: 56px;
      --statusbar-height: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation;
      scroll-behavior: smooth;
    }

    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-main);
      font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-user-select: none;
      user-select: none;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    a {
      color: var(--nexus-cyan);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img,
    video,
    canvas,
    svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    ul, ol {
      list-style: none;
    }

    ::selection {
      background: var(--nexus-cyan);
      color: #000;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-void);
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--nexus-cyan);
    }

    @media (max-width: 767px) {
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 70%);
      color: var(--nexus-cyan);
      font-family: ui-monospace, 'Courier New', monospace;
      transition: opacity 0.6s ease;
      padding: 20px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(20px + var(--safe-bottom));
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-top-color: var(--nexus-cyan);
      border-radius: 50%;
      animation: nexus-spin 1s linear infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 32px rgba(0, 240, 255, 0.3);
    }

    @keyframes nexus-spin {
      to { transform: rotate(360deg); }
    }

    #loading-overlay .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--nexus-cyan);
      text-align: center;
      margin-bottom: 8px;
    }

    #loading-overlay .status {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    #loading-overlay .progress {
      width: 100%;
      max-width: 320px;
      height: 4px;
      background: rgba(0, 240, 255, 0.1);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    #loading-overlay .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--nexus-cyan), var(--nexus-purple));
      transition: width 0.3s ease;
      box-shadow: 0 0 12px var(--nexus-cyan);
    }

    #loading-overlay .version {
      position: absolute;
      bottom: calc(20px + var(--safe-bottom));
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
    }

    #app {
      display: none;
      height: 100vh;
      height: calc(var(--dvh) * 100);
      width: 100vw;
      flex-direction: column;
      background: var(--bg-void);
      overflow: hidden;
    }

    #app.ready {
      display: flex;
    }

    .nexus-touch {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nexus-scroll {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .nexus-safe-top {
      padding-top: var(--safe-top);
    }

    .nexus-safe-bottom {
      padding-bottom: var(--safe-bottom);
    }

    @media (max-width: 767px) {
      .nexus-desktop-only {
        display: none !important;
      }
      .nexus-mobile-only {
        display: block !important;
      }
    }

    @media (min-width: 768px) {
      .nexus-mobile-only {
        display: none !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (hover: none) {
      .nexus-hover-only:hover {
        background: inherit !important;
      }
    }

    @supports (padding: max(0px)) {
      .nexus-safe-area {
        padding-top: max(0px, var(--safe-top));
        padding-right: max(0px, var(--safe-right));
        padding-bottom: max(0px, var(--safe-bottom));
        padding-left: max(0px, var(--safe-left));
      }
    }

    .nexus-focus-ring:focus-visible {
      outline: 2px solid var(--nexus-cyan);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .nexus-loading-pulse {
      animation: nexus-pulse 1.5s ease-in-out infinite;
    }

    @keyframes nexus-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .nexus-glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(26, 26, 26, 0.85);
    }

    .nexus-text-gradient {
      background: linear-gradient(90deg, var(--nexus-cyan), var(--nexus-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nexus-glow {
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.35);
    }

    .nexus-glow-purple {
      box-shadow: 0 0 24px rgba(138, 43, 226, 0.35);
    }

    @media (display-mode: standalone) {
      #loading-overlay .version::after {
        content: ' · PWA';
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@core/": "./src/core/",
        "@ui/": "./src/ui/",
        "@services/": "./src/services/",
        "@plugins/": "./src/plugins/",
        "@utils/": "./src/utils/",
        "@workers/": "./src/workers/",
        "@pwa/": "./src/pwa/"
      }
    }
  </script>

  <noscript>
    <style>
      #loading-overlay .spinner,
      #loading-overlay .status,
      #loading-overlay .progress {
        display: none;
      }
    </style>
  </noscript>
</head>
<body>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading NEXUS EXTRACTOR">
    <div class="spinner" aria-hidden="true"></div>
    <div class="brand">NEXUS EXTRACTOR</div>
    <div class="status" id="load-status">Booting system...</div>
    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="load-progress"></div>
    </div>
    <div class="version">v5.0.0</div>
    <noscript>
      <p style="color:#ff003c;margin-top:20px;text-align:center;font-size:12px;">
        NEXUS requires JavaScript to run.
      </p>
    </noscript>
  </div>

  <div id="app" role="application" aria-label="NEXUS EXTRACTOR"></div>

  <script type="module">
    import { bootstrap } from './src/main.js';

    const statusEl = document.getElementById('load-status');
    const overlay = document.getElementById('loading-overlay');
    const app = document.getElementById('app');

    const setStatus = (msg) => {
      if (statusEl) statusEl.textContent = msg;
    };

    const setProgress = (pct) => {
      const bar = document.getElementById('load-progress');
      if (bar) bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
    };

    const showError = (err) => {
      setStatus('⚠ ' + (err?.message || String(err)));
      if (statusEl) statusEl.style.color = '#ff003c';
      console.error('Boot error:', err);
    };

    const onReady = () => {
      overlay.classList.add('hidden');
      app.classList.add('ready');
      app.style.display = 'flex';
      setTimeout(() => {
        if (overlay && overlay.parentNode) overlay.style.display = 'none';
      }, 800);
    };

    let progressEstimate = 0;
    const onProgress = (msg) => {
      setStatus(msg);
      progressEstimate = Math.min(95, progressEstimate + 8);
      setProgress(progressEstimate);
    };

    bootstrap({
      onProgress,
      onReady,
      onError: showError,
    }).then((di) => {
      setProgress(100);
      if (window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('pwa-standalone');
      }
    }).catch(showError);

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch((err) => {
          console.warn('[NEXUS] SW registration failed', err);
        });
      });
    }

    window.addEventListener('online', () => document.documentElement.classList.remove('is-offline'));
    window.addEventListener('offline', () => document.documentElement.classList.add('is-offline'));
    if (!navigator.onLine) document.documentElement.classList.add('is-offline');
  </script>
</body>
</html>
