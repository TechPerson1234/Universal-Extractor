<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS EXTRACTOR v4.0</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Core libraries (loaded as classic scripts for global availability) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.29/dist/zip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

  <!-- Base styles & loading overlay -->
  <style>
    /* === CSS Variables (same as original, will be overridden by ThemeManager) === */
    :root {
      --bg-void: #050505;
      --bg-surface: #111111;
      --bg-panel: #1a1a1a;
      --nexus-cyan: #00f0ff;
      --nexus-purple: #8a2be2;
      --nexus-red: #ff003c;
      --text-main: #e0e0e0;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-void);
      color: var(--text-main);
      font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-void); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--nexus-cyan); }

    /* Loading overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-void);
      color: var(--nexus-cyan);
      font-family: 'Courier New', monospace;
      transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-overlay .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-top-color: var(--nexus-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-overlay .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--nexus-cyan);
    }
    #loading-overlay .status {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* App container – hidden until loaded */
    #app {
      display: none;
      height: 100vh;
      width: 100vw;
      flex-direction: column;
      background: var(--bg-void);
    }
    #app.ready {
      display: flex;
    }
  </style>

  <!-- Import Map for ES Module resolution -->
  <script type="importmap">
    {
      "imports": {
        "@core/": "./src/core/",
        "@ui/": "./src/ui/",
        "@services/": "./src/services/",
        "@plugins/": "./src/plugins/",
        "@utils/": "./src/utils/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="brand">NEXUS EXTRACTOR</div>
    <div class="status" id="load-status">Booting system...</div>
  </div>

  <!-- Main Application Container -->
  <div id="app">
    <!-- The UI will be dynamically rendered by UIManager -->
  </div>

  <!-- Entry Module -->
  <script type="module">
    // Import the main application bootstrap
    import { bootstrap } from './src/main.js';

    // Update loading status
    const statusEl = document.getElementById('load-status');
    const overlay = document.getElementById('loading-overlay');
    const app = document.getElementById('app');

    // Bootstrap the app
    bootstrap({
      onProgress: (msg) => {
        if (statusEl) statusEl.textContent = msg;
      },
      onReady: () => {
        // Hide loading overlay, show app
        overlay.classList.add('hidden');
        app.classList.add('ready');
        app.style.display = 'flex';
      },
      onError: (err) => {
        statusEl.textContent = '⚠️ Error: ' + err.message;
        statusEl.style.color = '#ff003c';
        console.error('Boot error:', err);
      }
    });
  </script>
</body>
</html>
